<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Seguridad: solo se ejecuta y se carga lo de esta misma web; nada sale hacia fuera. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Grammar Games</title>
  <meta name="description" content="Gramática de inglés (Inglés I) jugando: teoría de las unidades, ejercicios y minijuegos en el navegador.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <button class="btn icon menu" id="btnMenu" type="button" aria-label="Abrir el menú" aria-expanded="false">☰</button>
    <a class="brand" href="#/home">
      <span class="logo" aria-hidden="true">Aa</span>
      <span class="brand-txt">
        <strong>Grammar Games</strong>
        <small>Inglés I · aprende jugando</small>
      </span>
    </a>

    <button class="hud" id="hud" type="button" title="Ver rangos y logros">
      <span class="hud-level" id="hudLevel">1</span>
      <span class="hud-info">
        <span class="hud-row"><b id="hudRank">Starter</b><small id="hudXp">0 XP</small></span>
        <span class="bar"><i id="hudFill"></i></span>
      </span>
    </button>

    <div class="top-actions">
      <button class="btn" id="btnTrophy" type="button" aria-label="Logros">🏆 <span id="badgeCount">0/14</span></button>
      <button class="btn" id="btnCheat" type="button">Chuleta</button>
      <button class="btn icon needs-voice" id="btnVoice" type="button" aria-label="Activar o quitar la voz" title="Voz en inglés">🔊</button>
      <button class="btn icon" id="btnTheme" type="button" aria-label="Cambiar entre tema claro y oscuro" title="Tema claro / oscuro">🌓</button>
    </div>
  </header>

  <main class="layout">
    <nav id="sidebar" aria-label="Unidades, lecciones y juegos"></nav>
    <section id="stage" tabindex="-1"></section>
  </main>

  <dialog id="cheat" class="dlg">
    <div class="dlg-head">
      <strong>Chuleta</strong>
      <input id="cheatSearch" type="search" placeholder="Buscar: since, whose, went…" aria-label="Buscar en la chuleta">
      <button class="btn icon dlg-close" type="button" aria-label="Cerrar">✕</button>
    </div>
    <div class="dlg-body" id="cheatBody"></div>
  </dialog>

  <dialog id="trophy" class="dlg">
    <div class="dlg-head">
      <strong>Rangos y logros</strong>
      <span class="grow"></span>
      <button class="btn icon dlg-close" type="button" aria-label="Cerrar">✕</button>
    </div>
    <div class="dlg-body" id="trophyBody"></div>
  </dialog>

  <div id="toasts" aria-live="polite"></div>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
